apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: be
  namespace: be
spec:
  replicas: 4
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
        - name: be
          image: tuphucnguyen20051/be-demo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ERROR_RATE
              value: "0"
            - name: VERSION
              value: "v2"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
  strategy:
    canary:
      analysis:
        templates:
          - templateName: success-rate
        startingStep: 1
      steps:
        - setWeight: 25
        - pause:
            duration: 2m
        - setWeight: 50
        - pause:
            duration: 2m
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: be-svc
  namespace: be
  labels:
    app: be
spec:
  selector:
    app: be
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
