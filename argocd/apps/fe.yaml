apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/donan2k5/argocd-demo
    targetRevision: main
    path: fe
  destination:
    server: https://kubernetes.default.svc
    namespace: fe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
