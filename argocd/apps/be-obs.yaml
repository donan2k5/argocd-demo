apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: be-obs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/donan2k5/argocd-demo
    targetRevision: main
    path: k8s-be
  destination:
    server: https://kubernetes.default.svc
    namespace: be
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
