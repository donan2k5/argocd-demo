apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  namespace: be
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      containers:
        - name: be
          image: tuphucnguyen20051/be-demo:latest
          ports:
            - containerPort: 8000
