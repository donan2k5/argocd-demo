name: validate
on:
  pull_request:
    paths:
      - "fe/**"
      - "be/**"
      - "argocd/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kc.tgz && sudo mv kubeconform /usr/local/bin/

      - name: Validate fe manifests
        run: kubeconform -strict -summary fe/

      - name: Validate be manifests
        run: kubeconform -strict -summary be/
